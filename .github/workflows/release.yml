name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: "System deps (rt-gui eframe/x11 + rfd/gtk3)"
        timeout-minutes: 8
        run: |
          set -eux
          # ubuntu-latest pins azure.archive.ubuntu.com; that mirror Ign+stalls (CI 32227883104).
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            printf '%s\n' 'http://archive.ubuntu.com/ubuntu' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          fi
          if [ -f /etc/apt/sources.list.d/ubuntu.sources ]; then
            sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|http://archive.ubuntu.com/ubuntu|g' \
              /etc/apt/sources.list.d/ubuntu.sources
          fi
          sudo DEBIAN_FRONTEND=noninteractive apt-get \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=15 \
            -o Acquire::https::Timeout=15 \
            update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=15 \
            -o Acquire::https::Timeout=15 \
            install -y --no-install-recommends \
            libgtk-3-dev libx11-dev libxcursor-dev libxrandr-dev \
            libxi-dev libxkbcommon-dev libgl1-mesa-dev pkg-config

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85"

      - name: Build release binaries
        run: cargo build --release -p rt-host -p rt-cli -p rt-gui

      - name: Pack tar.gz and sha256
        run: |
          set -eu
          tag="${GITHUB_REF_NAME}"
          name="rusttraycer-${tag}-linux-x86_64"
          stage="${RUNNER_TEMP}/${name}"
          mkdir -p "${stage}"
          cp target/release/rt-host target/release/rt-cli target/release/rt-gui "${stage}/"
          mkdir -p dist
          tar -C "${RUNNER_TEMP}" -czf "dist/${name}.tar.gz" "${name}"
          (cd dist && sha256sum "${name}.tar.gz" > SHA256SUMS)

      - name: Pack AppImage and .deb
        run: scripts/pack-linux.sh "${GITHUB_REF_NAME}" dist target/release

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/rusttraycer-${{ github.ref_name }}-linux-x86_64.tar.gz
            dist/rusttraycer-${{ github.ref_name }}-linux-x86_64.AppImage
            dist/*.deb
            dist/SHA256SUMS
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
