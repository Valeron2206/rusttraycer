name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: "System deps (rt-gui eframe/x11 + rfd/gtk3)"
        timeout-minutes: 8
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            libgtk-3-dev libx11-dev libxcursor-dev libxrandr-dev \
            libxi-dev libxkbcommon-dev libgl1-mesa-dev pkg-config

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85"

      - name: Build release binaries
        run: cargo build --release -p rt-host -p rt-cli -p rt-gui

      - name: Pack tar.gz and sha256
        run: |
          set -eu
          tag="${GITHUB_REF_NAME}"
          name="rusttraycer-${tag}-linux-x86_64"
          stage="${RUNNER_TEMP}/${name}"
          mkdir -p "${stage}"
          cp target/release/rt-host target/release/rt-cli target/release/rt-gui "${stage}/"
          mkdir -p dist
          tar -C "${RUNNER_TEMP}" -czf "dist/${name}.tar.gz" "${name}"
          (cd dist && sha256sum "${name}.tar.gz" > SHA256SUMS)

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/rusttraycer-${{ github.ref_name }}-linux-x86_64.tar.gz
            dist/SHA256SUMS
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
